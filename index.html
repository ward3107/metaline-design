    <!-- Anti-flicker script - must run before any content renders -->
    <script>
      (function() {
        try {
          const THEME_MODE_KEY = 'theme_mode';
          const savedMode = localStorage.getItem(THEME_MODE_KEY);

          // Determine initial theme
          let theme = 'light';
          if (savedMode === 'light' || savedMode === 'dark') {
            theme = savedMode;
          } else if (savedMode === 'system' || !savedMode) {
            // System preference
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          // Apply theme immediately to prevent flicker
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Fail silently - default to light
          console.warn('Theme initialization failed:', e);
        }
      })();
    </script>

    <!--
      Cookie Consent — Amendment 13 compliant — GTM Consent Mode v2
      Sets default consent state to "denied" before any tracking loads.
      When you wire up Google Tag Manager, add the GTM snippet AFTER this script.

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 2000
      });
    </script>
